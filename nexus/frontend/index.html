<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXUS Dashboard</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Consolas', 'Courier New', monospace; background: #fff; color: #000; font-size: 14px; line-height: 1.5; }
a { color: #000; text-decoration: underline; }
a:hover { background: #000; color: #fff; }
.header { border-bottom: 2px solid #000; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; }
.header h1 { font-size: 18px; font-weight: 700; }
.header h1 span { background: #000; color: #fff; padding: 0 6px; }
.header .nav a { margin-left: 12px; font-size: 13px; }
.content { max-width: 960px; margin: 0 auto; padding: 20px; }
.section { border: 1px solid #000; margin-bottom: 20px; }
.section-title { background: #000; color: #fff; padding: 6px 12px; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
.section-body { padding: 16px; }
.row { display: flex; gap: 16px; margin-bottom: 12px; flex-wrap: wrap; }
.col { flex: 1; min-width: 200px; }
label { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 2px; }
input, select, textarea { font-family: inherit; font-size: 13px; padding: 6px 10px; border: 1px solid #000; background: #fff; color: #000; width: 100%; border-radius: 0; }
input:focus, select:focus, textarea:focus { outline: 2px solid #000; }
textarea { min-height: 60px; resize: vertical; }
.btn { font-family: inherit; font-size: 12px; padding: 6px 14px; border: 1px solid #000; background: #fff; color: #000; cursor: pointer; border-radius: 0; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 700; }
.btn:hover { background: #000; color: #fff; }
.btn-sm { padding: 3px 8px; font-size: 11px; }
.btn-red { border-color: #000; }
.btn-red:hover { background: #000; color: #fff; }
.stat-box { border: 1px solid #000; padding: 10px; text-align: center; min-width: 120px; }
.stat-box .num { font-size: 24px; font-weight: 700; }
.stat-box .lbl { font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
table { border-collapse: collapse; width: 100%; font-size: 12px; }
th, td { border: 1px solid #000; padding: 6px 10px; text-align: left; }
th { background: #000; color: #fff; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
tr:hover { background: #f5f5f5; }
.code { font-family: inherit; background: #f5f5f5; border: 1px solid #000; padding: 8px 10px; font-size: 12px; word-break: break-all; }
.alert { border: 1px solid #000; padding: 8px 12px; margin: 8px 0; font-size: 12px; }
.alert-ok { background: #fff; }
.alert-err { background: #000; color: #fff; }
.hidden { display: none; }
.mt { margin-top: 12px; }
.mb { margin-bottom: 12px; }
.flex { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.gap { gap: 12px; }
.w-full { width: 100%; }
.copy-btn { cursor: pointer; border: 1px solid #000; padding: 2px 8px; font-size: 11px; background: #fff; font-family: inherit; }
.copy-btn:hover { background: #000; color: #fff; }
.status-dot { display: inline-block; width: 8px; height: 8px; border: 1px solid #000; margin-right: 4px; }
.status-dot.on { background: #000; }
</style>
</head>
<body>

<div class="header">
  <h1><span>NEXUS</span> Dashboard</h1>
  <div class="nav">
    <a href="/">Home</a>
    <a href="/admin">Admin</a>
    <a href="#" id="logout-link" class="hidden" onclick="logout()">Logout</a>
  </div>
</div>

<div class="content">

<div id="login-section">
  <div class="section">
    <div class="section-title">Register</div>
    <div class="section-body">
      <div class="row">
        <div class="col">
          <label>Client Name</label>
          <input type="text" id="reg-name" placeholder="your-company">
        </div>
        <div class="col">
          <label>Password</label>
          <input type="password" id="reg-pass" placeholder="choose a password">
        </div>
        <div class="col">
          <label>Contact Email</label>
          <input type="email" id="reg-email" placeholder="you@company.com">
        </div>
      </div>
      <button class="btn" onclick="register()">Register</button>
      <span style="font-size:12px;margin-left:12px;">or <a href="#" onclick="showLogin()">Login</a></span>
      <div id="reg-result" class="alert hidden mt"></div>
    </div>
  </div>

  <div class="section" id="login-form">
    <div class="section-title">Login</div>
    <div class="section-body">
      <div class="row">
        <div class="col">
          <label>Client Name</label>
          <input type="text" id="login-name" placeholder="your-company">
        </div>
        <div class="col">
          <label>Password</label>
          <input type="password" id="login-pass" placeholder="your password">
        </div>
      </div>
      <button class="btn" onclick="login()">Login</button>
      <div id="login-result" class="alert hidden mt"></div>
    </div>
  </div>
</div>

<div id="dashboard-section" class="hidden">
  <div class="section">
    <div class="section-title">Your Account</div>
    <div class="section-body">
      <div class="row">
        <div class="stat-box"><div class="num" id="d-credits">-</div><div class="lbl">Credits</div></div>
        <div class="stat-box"><div class="num" id="d-rate">-</div><div class="lbl">Rate/h</div></div>
        <div class="stat-box"><div class="num" id="d-max">-</div><div class="lbl">Max Results</div></div>
        <div class="stat-box"><div class="num" id="d-client">-</div><div class="lbl">Client</div></div>
      </div>
      <div class="mb">
        <label>Your API Key</label>
        <div class="flex">
          <div class="code" id="d-apikey" style="flex:1;"></div>
          <button class="copy-btn" onclick="copyKey()">Copy</button>
          <button class="btn btn-sm" onclick="regenerateKey()">Regenerate</button>
        </div>
      </div>
      <div id="key-result" class="alert hidden mt"></div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Contact Admin</div>
    <div class="section-body">
      <div class="row">
        <div class="col">
          <label>Subject</label>
          <input type="text" id="contact-subject" placeholder="e.g. Need more credits">
        </div>
        <div class="col">
          <label>Request Type</label>
          <select id="contact-type">
            <option value="credit_increase">Credit Increase</option>
            <option value="rate_increase">Rate Limit Increase</option>
            <option value="bug_report">Bug Report</option>
            <option value="other">Other</option>
          </select>
        </div>
      </div>
      <div class="mb">
        <label>Message</label>
        <textarea id="contact-msg" placeholder="Describe what you need..."></textarea>
      </div>
      <button class="btn" onclick="sendContact()">Send Message</button>
      <div id="contact-result" class="alert hidden mt"></div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">System Status</div>
    <div class="section-body">
      <div class="row" id="health-info">
        <div class="col"><span class="status-dot" id="health-db"></span> Database</div>
        <div class="col"><span class="status-dot" id="health-redis"></span> Redis</div>
      </div>
    </div>
  </div>
</div>

</div>

<script>
const API = window.location.origin;

function $(id) { return document.getElementById(id); }

function show(el) { if (typeof el === 'string') el = $(el); el.classList.remove('hidden'); }
function hide(el) { if (typeof el === 'string') el = $(el); el.classList.add('hidden'); }

function getSession() {
  try { return JSON.parse(localStorage.getItem('nexus_session') || '{}'); } catch { return {}; }
}

function setSession(data) {
  localStorage.setItem('nexus_session', JSON.stringify(data));
}

function clearSession() {
  localStorage.removeItem('nexus_session');
}

async function api(method, path, body, useKey) {
  const headers = {};
  if (body && !(body instanceof FormData)) {
    headers['Content-Type'] = 'application/json';
  }
  const s = getSession();
  if (useKey !== false && s.api_key) {
    headers['X-API-Key'] = s.api_key;
  }
  const opts = { method, headers };
  if (body) {
    opts.body = body instanceof FormData ? body : JSON.stringify(body);
  }
  const res = await fetch(API + path, opts);
  const text = await res.text();
  let data;
  try { data = JSON.parse(text); } catch { data = { raw: text }; }
  return { ok: res.ok, status: res.status, data };
}

async function register() {
  const name = $('reg-name').value.trim();
  const pass = $('reg-pass').value;
  const email = $('reg-email').value.trim();
  if (!name || !pass) { showAlert('reg-result', 'Name and password required', true); return; }
  const fd = new FormData();
  fd.set('client_name', name);
  fd.set('password', pass);
  fd.set('contact_email', email);
  const r = await api('POST', '/api/register', fd, false);
  if (r.ok) {
    setSession({ api_key: r.data.api_key, client_id: r.data.client_id, client_name: name });
    showAlert('reg-result', 'Registered! API key: ' + r.data.api_key, false);
    loadDashboard();
  } else {
    showAlert('reg-result', r.data.detail || 'Registration failed', true);
  }
}

async function login() {
  const name = $('login-name').value.trim();
  const pass = $('login-pass').value;
  if (!name || !pass) { showAlert('login-result', 'Name and password required', true); return; }
  const fd = new FormData();
  fd.set('client_name', name);
  fd.set('password', pass);
  const r = await api('POST', '/api/login', fd, false);
  if (r.ok) {
    setSession({ api_key: r.data.api_key, client_id: r.data.client_id, client_name: name });
    showAlert('login-result', 'Logged in as ' + name, false);
    loadDashboard();
  } else {
    showAlert('login-result', r.data.detail || 'Login failed', true);
  }
}

function logout() {
  clearSession();
  hide('dashboard-section');
  show('login-section');
  hide('logout-link');
}

async function loadDashboard() {
  const s = getSession();
  if (!s.api_key) { show('login-section'); hide('dashboard-section'); hide('logout-link'); return; }

  hide('login-section');
  show('dashboard-section');
  show('logout-link');

  const r = await api('GET', '/api/user/profile');
  if (!r.ok) { logout(); return; }

  const p = r.data;
  $('d-client').textContent = p.client_name;
  $('d-credits').textContent = p.credits_remaining;
  $('d-rate').textContent = p.rate_limit_per_hour + '/h';
  $('d-max').textContent = p.max_results_cap;
  $('d-apikey').textContent = p.api_key;

  const h = await api('GET', '/api/health', null, false);
  if (h.ok) {
    const db = $('health-db'); db.className = 'status-dot' + (h.data.db ? ' on' : '');
    const rd = $('health-redis'); rd.className = 'status-dot' + (h.data.redis ? ' on' : '');
  }
}

async function sendContact() {
  const subject = $('contact-subject').value.trim();
  const msg = $('contact-msg').value.trim();
  if (!subject || !msg) { showAlert('contact-result', 'Subject and message required', true); return; }
  const fd = new FormData();
  fd.set('subject', subject);
  fd.set('message', msg);
  const r = await api('POST', '/api/user/contact', fd);
  if (r.ok) {
    showAlert('contact-result', 'Message sent to admin', false);
    $('contact-subject').value = '';
    $('contact-msg').value = '';
  } else {
    showAlert('contact-result', r.data.detail || 'Failed to send', true);
  }
}

async function regenerateKey() {
  if (!confirm('Regenerate API key? The old key will stop working.')) return;
  const r = await api('POST', '/api/user/regenerate-key');
  if (r.ok) {
    const s = getSession();
    s.api_key = r.data.api_key;
    setSession(s);
    $('d-apikey').textContent = r.data.api_key;
    showAlert('key-result', 'New API key generated', false);
  } else {
    showAlert('key-result', r.data.detail || 'Failed', true);
  }
}

function copyKey() {
  const key = $('d-apikey').textContent;
  navigator.clipboard.writeText(key).catch(function() {});
  showAlert('key-result', 'Copied!', false);
  setTimeout(function() { hide('key-result'); }, 2000);
}

function showAlert(id, msg, isErr) {
  const el = $(id);
  el.textContent = msg;
  el.className = 'alert mt ' + (isErr ? 'alert-err' : 'alert-ok');
  show(el);
  if (!isErr) setTimeout(function() { hide(el); }, 4000);
}

function showLogin() {
  $('login-form').scrollIntoView();
}

(function init() {
  if (getSession().api_key) loadDashboard();
})();
</script>

</body>
</html>
