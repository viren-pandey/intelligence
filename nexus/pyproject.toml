[project]
name = "nexus"
version = "1.0.0"
description = "Intelligent Recruitment Middleware"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "asyncpg>=0.29",
    "redis[hiredis]>=5.0",
    "celery[redis]>=5.3",
    "httpx>=0.27",
    "playwright>=1.43",
    "scrapy>=2.11",
    "beautifulsoup4>=4.12",
    "simhash>=2.1",
    "python-whois>=0.9",
    "dnspython>=2.6",
    "jinja2>=3.1",
    "structlog>=24.1",
    "tenacity>=8.2",
    "python-multipart>=0.0.9",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
